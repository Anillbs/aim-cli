[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aim-cli"
version = "1.0.0"
description = "AIM Security DAST — Command-Line Interface"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [{ name = "AIM Security", email = "engineering@aimsecurity.io" }]
keywords = ["security", "dast", "cli", "vulnerability-scanner"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "httpx>=0.27,<1.0",
    "keyring>=25.0,<27.0",
    "tomli-w>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
aim = "aim_cli.app:main"

[project.urls]
Homepage = "https://aimsecurity.io"
Documentation = "https://docs.aimsecurity.io/cli"
Repository = "https://github.com/aimsecurity/aim-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/aim_cli"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
